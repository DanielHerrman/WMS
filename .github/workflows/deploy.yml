name: Deploy to Zima OS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: wms_db
          MYSQL_USER: wms_user
          MYSQL_PASSWORD: wms_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: wms_db
          DB_USER: wms_user
          DB_PASSWORD: wms_password
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DJANGO_ENV: development
        run: |
          python manage.py migrate
          python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Zima OS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ZIMA_HOST }}
          username: ${{ secrets.ZIMA_USER }}
          key: ${{ secrets.ZIMA_SSH_KEY }}
          port: ${{ secrets.ZIMA_PORT || '22' }}
          script: |
            cd /path/to/wms_backend
            git pull origin main
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T wms_app python manage.py migrate