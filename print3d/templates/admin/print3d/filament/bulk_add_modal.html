{% load i18n %}
<div id="bulk-add-modal" style="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;" onclick="if(event.target===this) this.remove()">
    <div style="background:#fff;border-radius:0.5rem;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-width:480px;width:90%;margin:0 1rem;border:1px solid #e5e7eb;" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 px-6 py-4">
            <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100">{% trans "Bulk Add Filament Spools" %}</h2>
            <button onclick="document.getElementById('bulk-add-modal').remove()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                <span class="material-symbols-outlined text-xl">close</span>
            </button>
        </div>

        <form method="post" action="bulk-add/" class="px-6 py-4 space-y-4" onsubmit="this.querySelector('button[type=submit]').disabled=true; this.querySelector('button[type=submit]').innerText='Creating...'">
            {% csrf_token %}
            <div>
                <label for="modal-organization" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{% trans "Organization" %}</label>
                <select name="organization" id="modal-organization" required class="block w-full rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2">
                    <option value="">---------</option>
                    {% for org in organizations %}
                    <option value="{{ org.id }}">{{ org.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="modal-brand" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{% trans "Brand" %}</label>
                <select name="brand" id="modal-brand" required class="block w-full rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2">
                    <option value="">---------</option>
                    {% for brand in brands %}
                    <option value="{{ brand.id }}">{{ brand.name }} — {{ brand.material_type }} ({{ brand.spool_size_kg }} kg)</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="modal-count" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{% trans "Number of Spools" %}</label>
                <input type="number" name="count" id="modal-count" min="1" max="100" value="1" required class="block w-full rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2">
            </div>
            <div>
                <label for="modal-weight" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{% trans "Initial Net Weight (g)" %} <span class="text-gray-400">({% trans "optional" %})</span></label>
                <input type="number" name="initial_net_weight_g" id="modal-weight" step="0.01" class="block w-full rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2" placeholder="e.g. 1000">
            </div>
            <div>
                <label for="modal-price" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{% trans "Price per kg Override (CZK)" %} <span class="text-gray-400">({% trans "optional" %})</span></label>
                <input type="number" name="price_per_kg_override" id="modal-price" step="0.01" class="block w-full rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm px-3 py-2" placeholder="Uses brand price if blank">
            </div>
            <div class="flex items-center gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                <button type="submit" class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 transition-colors">
                    {% trans "Create Spools" %}
                </button>
                <button type="button" onclick="document.getElementById('bulk-add-modal').remove()" class="inline-flex items-center px-4 py-2 bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 text-sm font-semibold rounded-md border border-gray-300 dark:border-gray-600 shadow-sm hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors">
                    {% trans "Cancel" %}
                </button>
            </div>
        </form>
    </div>
</div>
